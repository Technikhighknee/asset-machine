<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asset Machine</title>
  <link rel="stylesheet" href="/viewer.css">

  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.module.js",
        "three/addons/": "/vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="app">
    <aside class="controls">
      <h1>Asset Machine</h1>

      <form id="texture-form">
        <label for="material">Material</label>
        <select id="material" name="material" required></select>

        <label for="seed">Seed</label>
        <input id="seed" name="seed" type="number" min="0" max="4294967295" step="1" value="12345" required>

        <label for="size">Resolution</label>
        <select id="size" name="size">
          <option value="128">128 × 128</option>
          <option value="256">256 × 256</option>
          <option value="512">512 × 512</option>
          <option value="1024" selected>1024 × 1024</option>
          <option value="2048">2048 × 2048</option>
        </select>

        <button id="new-seed" type="button">New Seed</button>
      </form>

      <label for="inspect-map">Inspect map</label>
      <select id="inspect-map">
        <option value="albedo">Base Color</option>
        <option value="normal">Normal (OpenGL)</option>
        <option value="roughness">Roughness</option>
        <option value="height">Height (8-bit preview)</option>
        <option value="ao">Ambient Occlusion</option>
        <option value="cavity">Cavity</option>
      </select>

      <button id="export-pbr" type="button">Export Reet PBR · 2K ZIP</button>

      <p id="status" role="status" aria-live="polite">Loading…</p>
    </aside>

    <main class="preview">
      <div class="view-modes" role="group" aria-label="Preview mode">
        <button type="button" data-preview-mode="sphere" aria-pressed="true">Sphere</button>
        <button type="button" data-preview-mode="image" aria-pressed="false">Image</button>
      </div>

      <canvas id="viewport" aria-label="3D material preview"></canvas>
      <div class="image-comparison">
        <figure class="image-panel">
          <figcaption>Single Texture</figcaption>
          <img id="image-preview" alt="Generated albedo texture">
        </figure>

        <figure class="image-panel">
          <figcaption>2 × 2 Tiled</figcaption>
          <div id="tiled-preview" role="img" aria-label="Texture repeated in a two by two grid"></div>
        </figure>
      </div>
      <span class="hint">Drag to rotate · Scroll to zoom</span>
    </main>
  </div>

  <script type="module" src="/viewer.js"></script>
</body>
</html>
